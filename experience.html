    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <header class="navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
            <!-- Mobile menu dropdown -->
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
                    </svg>
                </div>
                <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow">
                    <li><a glitch="ABOUT" href="index.html#about">About</a></li>
                    <li><a glitch="EXPERIENCE" href="experience.html">Experience</a></li>
                    <li><a glitch="PROJECTS" href="projects.html">Projects</a></li>
                    <!-- Mobile social icons -->
                    <li class="border-t border-gray-300 mt-2 pt-2">
                        <div class="flex justify-center gap-4">
                            <a href="mailto:vyla.main@gmail.com" target="_blank">
                                <img src="./Icons/email-close.png" alt="Email" class="w-6 h-6">
                            </a>
                            <a href="https://github.com/lavy-spu" target="_blank">
                                <img src="./Icons/github.png" alt="GitHub" class="w-6 h-6">
                            </a>
                            <a href="https://www.linkedin.com/in/vy-la/" target="_blank">
                                <img src="./Icons/linkedin.png" alt="LinkedIn" class="w-6 h-6">
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
            <!-- Logo -->
            <div class="logo">
                <a href="index.html#home" class="btn btn-ghost text-xl">
                    <h1>Vy La</h1>
                </a>
            </div>
        </div>
        
        <!-- Desktop menu -->
        <div class="navbar-center hidden lg:flex">
            <nav class="menu-list">
                <ul class="menu menu-horizontal px-1">
                    <li><a glitch="ABOUT" href="index.html#about">About</a></li>
                    <li><a glitch="EXPERIENCE" href="experience.html">Experience</a></li>
                    <li><a glitch="PROJECTS" href="projects.html">Projects</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- Social icons for desktop -->
        <div class="navbar-end">
            <div class="icons">
                <a href="mailto:vyla.main@gmail.com" target="_blank">
                    <img src="./Icons/email-close.png" alt="Email">
                </a>
                <a href="https://github.com/lavy-spu" target="_blank">
                    <img src="./Icons/github.png" alt="GitHub">
                </a>
                <a href="https://www.linkedin.com/in/vy-la/" target="_blank">
                    <img src="./Icons/linkedin.png" alt="LinkedIn">
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Experience section -->
        <section id="experience" class="experience-section">
            <h1>Experience</h1>
            <div class="experience-container">
                <aside class="experience-sidebar" id="company-list">
                    <!-- Companies will be dynamically populated -->
                </aside>
                <div class="experience-details">
                    <h2 id="exp-title" class="job-title"></h2>
                    <p id="exp-company" class="company-name"></p>
                    <p id="exp-date"></p>
                    <ul id="exp-detail-list"></ul>
                </div>
            </div>
            <button id="pfResume" class="resume-button">Open Resume</button>
            <!-- Resume Modal -->
            <div id="resumeModal" class="modal">
                <div class="modal-content">
                    <span class="close-button" id="closeModal">&times;</span>
                    <iframe id="resumeFrame" class="resume-frame" src="" frameborder="0"></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Built and designed by Vy La.<br>Copyright &copy; 2025</p>
    </footer>

    <script type="module" src="./Scripts/GetExperience.js"></script>

</html>
